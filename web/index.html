<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202020"><meta name="description" content="Hoja de conteo de jueces Costa Brava. Resultados guardados en este dispositivo."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>FCL · Judge Desk</title><link rel="stylesheet" href="./styles.css">
</head>
<body><section id="access-gate" class="access-gate"><strong>FCL · COSTA BRAVA</strong><h1>Acceso de jueces</h1><p>Introduce la contraseña para entrar.</p><form id="access-form"><label for="access-password">Contraseña</label><input id="access-password" type="password" required autocomplete="current-password"><p id="access-error" role="alert"></p><button class="primary" type="submit">Entrar</button></form><p class="muted">Recordaremos el acceso durante 30 días en este navegador.</p></section><div id="judge-shell" hidden><header class="brand"><div><strong>FCL</strong><span>COSTA BRAVA</span></div><p>JUDGE DESK · EL RELOJ DE PISTA MARCA LA PRUEBA</p></header><div class="connection" id="connection"></div><main id="app"><p>Cargando hojas de juez…</p></main><div id="save-status" role="status" class="save-status"></div><p id="error" role="alert" class="error" hidden></p><dialog id="confirmation" aria-labelledby="dialog-title"><form id="dialog-form"><h2 id="dialog-title"></h2><div id="dialog-body"></div><p id="dialog-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-dialog" autofocus>Cancelar</button><button type="submit" class="primary" id="confirm-dialog">Confirmar</button></div></form></dialog><dialog id="workout-viewer" aria-labelledby="workout-title"><div class="wod-view-header"><h2 id="workout-title"></h2><button type="button" id="close-workout">Volver al conteo</button></div><div id="workout-content"></div></dialog><footer>Guardado local · Conexión con Drive pendiente</footer></div><script type="module" src="./access.js"></script></body></html>
